services:
  postgres:
    image: postgres:16-alpine
    container_name: lupiva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lupiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lupiva_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lupiva}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lupiva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lupiva} -d $${POSTGRES_DB:-lupiva}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: lupiva-minio
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lupiva_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lupiva_minio_secret_2026}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - lupiva_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lupiva_pgdata:
  lupiva_minio_data:
